<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#033b7b" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#ff9e00" />
    </linearGradient>
  </defs>
  <!-- Rounded Shield Base -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4" />
  <!-- Paint brush swoosh -->
  <path d="M20 28 C45 15, 75 18, 85 30 C72 34, 45 32, 28 42 Z" fill="url(#goldGrad)" />
  <!-- AK Text -->
  <text x="50" y="68" font-family="'Montserrat', sans-serif" font-size="42" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="-2">AK</text>
  <!-- Accent dot -->
  <circle cx="78" cy="68" r="5" fill="#ffd200" />
</svg>
